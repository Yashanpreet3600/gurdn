# Keep your own `name:` line from the old pubspec if it was different.
# All imports in lib/ are relative, so the package name doesn't matter.
name: guardianx
description: GuardianX - personal safety app.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend: auth, database, storage, edge functions
  supabase_flutter: ^2.8.0

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5

  # Phone features
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9
  another_telephony: ^0.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Phase 3: SOS
  geolocator: ^13.0.1
  battery_plus: ^6.0.3

  # Phase 2: push alerts + restart recovery
  firebase_core: ^4.11.0
  firebase_messaging: ^16.1.3

  # Phase 3: maps for the guardian live view (OpenStreetMap tiles, no key)
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  http: ^1.2.2

  # Phase 5: evidence capture
  record: ^6.0.0
  path_provider: ^2.1.4
  share_plus: ^10.1.1

  # Phase 6: live video
  flutter_webrtc: ^0.12.5

  # Phase 7: voice (Tactical call, fake call), on-device
  flutter_tts: ^4.2.0

  # Phase 7: on-device AI (YAMNet model is in assets/models/)
  tflite_flutter: ^0.11.0

  # Phase 8: extra triggers (on-device)
  flutter_blue_plus: ^1.33.5
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
